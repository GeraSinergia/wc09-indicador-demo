<script>
(()=>{
const form=document.getElementById('unlock-form'),input=document.getElementById('password'),button=document.getElementById('unlock-button'),message=document.getElementById('unlock-message');
const payload=JSON.parse(document.getElementById('encrypted-payload').textContent);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(!input.value)return;
 if(!globalThis.crypto?.subtle){message.textContent='Abra o arquivo em um navegador atualizado, como Chrome ou Edge.';return;}
 button.disabled=true;button.textContent='Abrindo…';message.textContent='';
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv),additionalData:new TextEncoder().encode('GS-PAINEL-V1'),tagLength:128},key,bytes(payload.ciphertext));
  input.value='';
  const html=new TextDecoder('utf-8',{fatal:true}).decode(plaintext);
  document.open();document.write(html);document.close();
 }catch(error){
  message.textContent='Não foi possível abrir. Confira a senha e tente novamente.';
  input.value='';input.focus();button.disabled=false;button.textContent='Abrir painel';
 }
});
})();
</script>
